<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <rect fill="#E8EAED" width="1200" height="750"/>
  <text x="80" y="72" fill="#111" font-family="system-ui,sans-serif" font-size="28" font-weight="700">Meridian Goods</text>
  <text x="80" y="200" fill="#111" font-family="system-ui,sans-serif" font-size="44" font-weight="700">Eight objects for the desk,</text>
  <text x="80" y="258" fill="#111" font-family="system-ui,sans-serif" font-size="44" font-weight="700">the kitchen and the road.</text>
  <text x="80" y="310" fill="#5F6368" font-family="system-ui,sans-serif" font-size="20">One flat price across the whole shop.</text>
  <rect x="80" y="380" width="240" height="280" rx="16" fill="#DDE8D4"/>
  <rect x="340" y="380" width="240" height="280" rx="16" fill="#E8DCC8"/>
  <rect x="600" y="380" width="240" height="280" rx="16" fill="#C8D8E8"/>
  <rect x="860" y="380" width="240" height="280" rx="16" fill="#E8D4C8"/>
</svg>
